<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anime List</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/main.js" defer></script>
  <script src="js/anime-groups.js"></script>
  <script src="js/anime.js" defer></script>
</head>
<body>
<main>
  <h1>Anime list</h1>
  <p class="lead">Pulled live from my <a id="anilist-link" href="https://anilist.co" target="_blank" rel="noopener">AniList</a> profile.</p>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div id="filters" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search titles…" aria-label="Search titles">
    <select id="sort" aria-label="Sort">
      <option value="title">Title A–Z</option>
      <option value="updated">Recently updated</option>
      <option value="score">Highest score</option>
    </select>
  </div>

  <div id="list" class="anime-grid"><p class="muted">Loading…</p></div>
</main>
</body>
</html>
