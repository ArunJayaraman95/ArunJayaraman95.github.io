<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tier Lists</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/main.js" defer></script>
  <script src="js/tierlist.js" defer></script>
</head>
<body>
<main>
  <h1>Tier lists</h1>
  <p class="lead">My official, objectively correct rankings. Disagree? Drag things around to make your own.
    On a phone, tap an item and then tap a tier.</p>

  <div class="toolbar" id="tabs" style="margin-top:20px"></div>
  <div id="board"></div>
  <div class="pool" id="pool" data-tier="pool" aria-label="Unranked items"></div>

  <div class="toolbar" style="margin-top:16px">
    <button class="btn ghost" id="reset">Reset to my rankings</button>
    <button class="btn ghost" id="export" title="Copies the current layout as JSON for js/tierlist.js">Copy layout as JSON</button>
  </div>
</main>
</body>
</html>
